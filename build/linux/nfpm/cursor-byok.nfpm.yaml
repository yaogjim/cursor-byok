# cursor-byok 使用的 nfpm 打包配置。
#
# 说明：`build/linux/nfpm/nfpm.yaml` 由 `wails3 update build-assets` 生成，每次生成都会
# 被覆盖重写，且其模板引用了 `./build/linux/<binary>.desktop`，而当前 wails 版本实际生成的
# 桌面文件名为 `build/linux/desktop`，因此在 CI 上直接使用该模板会报 file does not exist。
# 打包统一改用本文件，由 `linux:package:installers` 显式指定，不受 build-assets 重写影响。
#
# 版本与架构从任务注入的环境变量读取：VERSION（来自 APP_VERSION）、ARCH（固定 amd64）。

name: "cursor-byok"
arch: ${ARCH}
platform: "linux"
version: ${VERSION}
section: "default"
priority: "extra"
maintainer: "yaogjim <yaogjim@users.noreply.github.com>"
description: "cursor-byok"
vendor: "cursor-byok"
homepage: "https://github.com/yaogjim/cursor-byok"
license: "MIT"
release: "1"

contents:
  - src: "./bin/cursor-byok"
    dst: "/usr/local/bin/cursor-byok"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/1024x1024/apps/cursor-byok.png"
  - src: "./build/appicon.png"
    dst: "/usr/share/pixmaps/cursor-byok.png"
  - src: "./build/linux/nfpm/cursor-byok.desktop"
    dst: "/usr/share/applications/cursor-byok.desktop"

# Debian 12 / Ubuntu 22.04+ 默认使用 WebKit 4.1
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"